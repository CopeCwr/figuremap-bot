name: Escáner figuremap Habbo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Modo prueba: simula 2 libs nuevas en habbo.es y envía el aviso a Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: figuremap-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Ejecutar escáner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ inputs.test }}
        run: python scanner.py

      - name: Guardar estado
        run: |
          git config user.name "figuremap-bot"
          git config user.email "figuremap-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
